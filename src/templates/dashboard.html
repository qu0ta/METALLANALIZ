<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг цен металлургических компаний</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-graph-up"></i> Металлургический Price Monitor
            </span>
        <div class="navbar-text text-white">
            <small id="stats-info">Загрузка статистики...</small>
        </div>
    </div>
</nav>

<div class="container-fluid mt-3">
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card shadow-sm">
                <div class="card-header bg-light">
                    <h5 class="mb-0"><i class="bi bi-funnel"></i> Фильтры</h5>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Компании <span class="text-danger">*</span></label>
                            <select multiple class="form-select" id="companies-select" size="8"
                                    onchange="onCompanyChange()">
                                <!-- Options will be loaded dynamically -->
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Продукт <span class="text-danger">*</span></label>
                            <select class="form-select" id="product-select" onchange="onProductChange()" disabled>
                                <option value="">-- Сначала выберите компанию --</option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Дата начала</label>
                            <input type="date" class="form-control" id="start-date">
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Дата окончания</label>
                            <input type="date" class="form-control" id="end-date">
                        </div>

                        <div class="col-md-2 d-flex align-items-end">
                            <button class="btn btn-primary w-100 me-2" onclick="updateChart()" id="load-btn">
                                <i class="bi bi-arrow-clockwise"></i> Обновить
                            </button>
                            <button class="btn btn-success" onclick="exportData()" title="Экспорт CSV">
                                <i class="bi bi-download"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-4" id="stats-cards" style="display: none;">
        <div class="col-md-3">
            <div class="card text-white bg-success">
                <div class="card-body">
                    <h6 class="card-title">Минимальная цена</h6>
                    <h3 id="min-price">-</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-danger">
                <div class="card-body">
                    <h6 class="card-title">Максимальная цена</h6>
                    <h3 id="max-price">-</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-info">
                <div class="card-body">
                    <h6 class="card-title">Средняя цена</h6>
                    <h3 id="avg-price">-</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-secondary">
                <div class="card-body">
                    <h6 class="card-title">Точек данных</h6>
                    <h3 id="data-points">-</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <div class="card shadow-sm">
                <div class="card-header bg-light d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-graph-up"></i> График цен</h5>
                    <small class="text-muted" id="chart-subtitle">Выберите компанию и продукт</small>
                </div>
                <div class="card-body">
                    <canvas id="priceChart" height="150" style="max-height: 600px;"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="mt-5 py-3 bg-light text-center">
    <div class="container">
        <small class="text-muted">
            Металлургический Price Monitor |
            <i class="bi bi-calendar3"></i> <span id="current-date"></span>
        </small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
